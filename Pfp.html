<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Css/Slutp.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body class="pfp-page">
    <nav class="navbar">
        <ul>
                <li class="contact-link">
                    <a href="Pfp.html"><img src="images/image.png" class="profile-img" alt="Profile"></a>
                    <div id="username-display" class="username-display"></div>
                </li>
                <li><a href="Slutp.html">Menu</a></li>
                <li><a href="Slutp2.html">Enemies</a></li>
                <li><a href="Slutp5.html">Stratagems</a></li>
                <li><a href="Slutp6.html">Armory</a></li>
        </ul>
    </nav>

    <img src="images/4260221-hell.jpg" alt="peace" class="mainback">

    <main class="main-container">
        <section class="profile-card">
            <h1>Profile settings</h1>
            <form id="username-form">
                <label for="username">Enter username:</label>
                <input type="text" id="username" name="username" placeholder="Your username" maxlength="10">
                <div class="upload-field">
                    <label for="avatar-input">Upload picture:</label>
                    <input type="file" id="avatar-input" accept="image/*">
                </div>
                <div class="button-row">
                    <button type="submit">Save</button>
                    <button id="logout-button" type="button" class="logout-btn">Log out</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        // Hämtar formuläret för användarnamn
const usernameForm = document.getElementById('username-form');

// Hämtar inputfältet för användarnamn
const usernameInput = document.getElementById('username');

// Hämtar elementet där användarnamnet visas
const usernameDisplay = document.getElementById('username-display');

// Hämtar inputfältet för profilbild
const avatarInput = document.getElementById('avatar-input');

// Hämtar profilbilden i navigationen
const profileImg = document.querySelector('.profile-img');

// Hämtar logout-knappen
const logoutButton = document.getElementById('logout-button');


// Funktion som hanterar lagring av data
function getStoredData() {

    try {

        // Testar om localStorage fungerar
        localStorage.setItem('__profile_test', '1');
        localStorage.removeItem('__profile_test');

        // Returnerar funktioner för localStorage
        return {

            // Hämtar sparad data
            getItem: key => localStorage.getItem(key),

            // Sparar data
            setItem: (key, value) => localStorage.setItem(key, value)
        };

    } catch (error) {

        // Om localStorage inte fungerar används window.name
        return {

            // Hämtar data från window.name
            getItem: key => {

                try {

                    // Läser in sparad data
                    const data = JSON.parse(window.name || '{}');

                    // Returnerar värdet eller null
                    return data[key] || null;

                } catch (e) {

                    // Returnerar null om något går fel
                    return null;
                }
            },

            // Sparar data i window.name
            setItem: (key, value) => {

                try {

                    // Hämtar tidigare sparad data
                    const data = JSON.parse(window.name || '{}');

                    // Sparar nytt värde
                    data[key] = value;

                    // Gör om objektet till text och sparar
                    window.name = JSON.stringify(data);

                } catch (e) {

                    // Skapar nytt objekt om något går fel
                    window.name = JSON.stringify({ [key]: value });
                }
            }
        };
    }
}


// Funktion som tar bort sparad data
function removeStoredData(key) {

    try {

        // Tar bort data från localStorage
        localStorage.removeItem(key);

    } catch (error) {

        try {

            // Hämtar sparad data
            const data = JSON.parse(window.name || '{}');

            // Tar bort vald nyckel
            delete data[key];

            // Sparar tillbaka datan
            window.name = JSON.stringify(data);

        } catch (e) {

            // Återställer datan om något går fel
            window.name = '{}';
        }
    }
}


// Hämtar lagringssystemet
const storage = getStoredData();


// Körs när formuläret skickas
usernameForm.addEventListener('submit', event => {

    // Stoppar sidan från att laddas om
    event.preventDefault();

    // Hämtar användarnamnet och begränsar till 10 tecken
    const value = usernameInput.value.trim().slice(0, 10);

    // Visar användarnamnet på sidan
    usernameDisplay.textContent = value ? value : '';

    // Sparar användarnamnet
    storage.setItem('profileUsername', value);

    // Hämtar vald bildfil
    const file = avatarInput.files[0];

    // Om en bild har valts
    if (file) {

        // Skapar en FileReader
        const reader = new FileReader();

        // Körs när bilden har laddats
        reader.onload = () => {

            // Byter profilbild
            profileImg.src = reader.result;

            // Sparar profilbilden
            storage.setItem('profileImage', reader.result);
        };

        // Läser bilden som data-url
        reader.readAsDataURL(file);
    }

    // Rensar inputfälten
    usernameInput.value = '';
    avatarInput.value = null;
});


// Körs när användaren klickar på logout
logoutButton.addEventListener('click', () => {

    // Tar bort sparat användarnamn
    removeStoredData('profileUsername');

    // Tar bort sparad profilbild
    removeStoredData('profileImage');

    // Återställer sparad data
    if (storage.setItem) {

        storage.setItem('profileUsername', '');

        // Sparar standardbilden istället för tomt värde
        storage.setItem('profileImage', 'images/image.png');
    }

    // Byter tillbaka till standardbilden
    profileImg.src = 'images/image.png';

    // Tar bort användarnamnet från sidan
    usernameDisplay.textContent = '';

    // Rensar formulärfälten
    usernameInput.value = '';
    avatarInput.value = null;
});
    </script>
    <script src="profile-store.js"></script>
    <footer class="footer">
        <button class="footer-btn left-btn" data-message="We are a small solo-run company that focuses on informing our fellow Helldivers about the casualties in the war."><a href="#">About us</a></button>
        <button class="footer-btn right-btn" data-message="phonenumber: 0706388652, Gmail: Helldivers.wiki.fandom@gmail.com"><a href="Pfp.html">Contact Information</a></button>
    </footer>
</body>
</html>
