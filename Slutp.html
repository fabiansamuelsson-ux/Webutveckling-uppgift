<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Slutp.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav class="navbar">
        <ul>
                <li class="contact-link"><a href="Pfp.html"><img src="image.png" class="profile-img" alt="Profile"></a><div id="username-display" class="username-display"></div></li>
                <li><a href="Slutp.html">Menu</a></li>
                <li><a href="Slutp2.html">Enemies</a></li>
                <li><a href="Slutp5.html">Stratagems</a></li>
                <li><a href="Slutp6.html">Armory</a></li>
        </ul>
</nav>
    <main>
        <section>
            <img src="4260221-hell.jpg" alt="peace" class="mainback"></img>
            <h1 class="herotitle">Information towards the war of peace</h1>
        </section>
        <div class="update">
            <h2>Updates
            <p>We have just gotten a new weapon against the eneimes in this great war. We hope the you Helldivers will use this to your advantage.</p></h2>
        </div>
    </main>

    <button id="contact-form-btn" class="contact-form-btn">Contact Us</button>

    <div id="contact-modal" class="contact-modal">
        <div class="contact-bubble">
            <span class="close-btn">&times;</span>
            <h3>Get in Touch</h3>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <button class="footer-btn left-btn" data-message="We are a small solo-run company that focuses on informing our fellow Helldivers about the casualties in the war."><a href="#">About us</a></button>
        <button class="footer-btn right-btn" data-message="phonenumber: 0706388652, Gmail: Helldivers.wiki.fandom@gmail.com"><a href="Pfp.html">Contact Information</a></button>
    </footer>
    <script src="Slutp.js"></script>
    <script src="profile-store.js"></script>
</body>
</html>
